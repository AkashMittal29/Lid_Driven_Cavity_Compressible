[Grid information]
grid_file     = grid.ini    ;grid file name

[Flow parameters]
Re_ref        = 550          ;Reference Reynolds number
M_ref         = 0.5         ;Reference Mach number

[Fluid properties]
Pr            = 0.72        ;Prandtl number
gamma         = 1.4         ;Gamma for air (Cp/Cv)

[Computational parameters]
dt_factor	  = 0.1			;Factor to assign dt using dt=dt_factor*min(dx,dy) for numerical stability
niter         = 5000          ;Number of time iterations
tolerance     = 1.0e-6      ;Tolerance to check convergence
eps4          = 7.8125e-3   ;Factor for 4th order numerical diffusion (for interior nodes)
eps2          = 7.8125e-3   ;Factor for 2nd order numerical diffusion (for boundary nodes)